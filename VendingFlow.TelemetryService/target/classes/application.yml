server:
  port: 8084
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/telemetry_db
    username: vendingflow
    password: vendingflow
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: localhost
    port: 5672
    username: vendingflow
    password: vendingflow
  data:
    redis:
      host: localhost
      port: 6379
management:
  endpoints:
    web:
      exposure:
        include: health,info
vendingflow:
  rabbit:
    exchange: vendingflow.events
  heartbeat:
    degraded-after-seconds: 30
    offline-after-seconds: 60
