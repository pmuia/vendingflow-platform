server:
  port: ${PORT:8084}
spring:
  application:
    name: vendingflow-telemetry-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telemetry_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:H@rd2Cr@k!!pmuia}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:vendingflow}
    password: ${SPRING_RABBITMQ_PASSWORD:vendingflow}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info
vendingflow:
  rabbit:
    exchange: ${VENDINGFLOW_RABBIT_EXCHANGE:vendingflow.events}
  heartbeat:
    degraded-after-seconds: ${VENDINGFLOW_HEARTBEAT_DEGRADED_AFTER_SECONDS:30}
    offline-after-seconds: ${VENDINGFLOW_HEARTBEAT_OFFLINE_AFTER_SECONDS:60}
